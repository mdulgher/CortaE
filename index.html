<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!-- Aplica o tema salvo antes de desenhar, para a tela não piscar no tema do sistema -->
  <script>try { var t = localStorage.getItem('cortae.tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9e040a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CortaÊ">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="img/icone-180.png">
  <meta name="description" content="CortaÊ — Escolha. Peça. Receba! Demonstração de app de pedidos de açougue (TCC).">
  <title>CortaÊ</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥩</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Figtree:wght@400;500;600;650;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/app.css?v=0.3.2">
  <link rel="stylesheet" href="css/cliente.css?v=0.3.2">
  <link rel="stylesheet" href="css/blueprint.css?v=0.3.2">
</head>
<body>
  <div class="app" id="app">
    <header id="topo"></header>
    <main id="tela" class="tela"></main>
    <nav class="abas" id="abas">
      <a class="aba" href="#/" data-aba="inicio"><span class="ico" data-ic="casa"></span>Início</a>
      <a class="aba" href="#/categorias" data-aba="categorias"><span class="ico" data-ic="grade"></span>Categorias</a>
      <a class="aba" href="#/assinatura" data-aba="assinatura"><span class="ico" data-ic="ciclo"></span>Assinatura</a>
      <a class="aba" href="#/pedidos" data-aba="pedidos"><span class="ico" data-ic="recibo"></span>Pedidos</a>
      <a class="aba" href="#/conta" data-aba="conta"><span class="ico" data-ic="pessoa"></span>Minha Conta</a>
    </nav>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="js/cliente.js?v=0.3.2"></script>
  <script>
    // Rede de segurança: se o app não desenhar nada em 8 s (rede ruim ou arquivo velho no cache do Safari
    // logo depois de publicar), mostra um aviso com botão de recarregar em vez de deixar a tela em branco.
    setTimeout(function () {
      var tela = document.getElementById('tela');
      if (document.querySelector('.boas-vindas') || tela.children.length || document.getElementById('topo').children.length) return;
      tela.innerHTML = '<div style="padding:48px 24px;text-align:center;display:grid;gap:14px;justify-items:center">'
        + '<span style="font-size:2.4rem">🥩</span><b style="font-size:1.15rem">O app não carregou</b>'
        + '<span style="color:var(--muted)">Pode ser a internet ou uma versão nova chegando. Toque para tentar de novo.</span>'
        + '<button class="btn btn-pri" onclick="location.reload()">Recarregar</button></div>';
    }, 8000);
  </script>
</body>
</html>
