<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!-- Aplica o tema salvo antes de desenhar, para a tela não piscar no tema do sistema -->
  <script>try { var t = localStorage.getItem('cortae.tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>CortaÊ Parceiros</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔪</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Figtree:wght@400;500;600;650;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/painel.css">
</head>
<body>
  <header class="barra-topo">
    <div class="marca-painel">
      <img class="marca-badge" src="img/logo.jpg" alt="CortaÊ">
      <h1>Parceiros<small>Painel do açougue</small></h1>
    </div>
    <label class="seletor">
      <select id="filtro-acougue" aria-label="Açougue">
        <option value="todos">Todos os açougues</option>
      </select>
    </label>
    <div class="topo-acoes">
      <button class="btn btn-ama" id="btn-som"><span data-ic="sino"></span> Ativar som</button>
      <button class="icone-btn" data-tema-btn></button>
      <button class="icone-btn" id="btn-zerar" title="Zerar demonstração" aria-label="Zerar demonstração"><span data-ic="reiniciar"></span></button>
    </div>
  </header>
  <nav class="abas-painel">
    <div class="segmento">
      <button class="aba-p ativa" data-aba="pedidos"><span data-ic="recibo"></span> Pedidos <span class="cont" id="cont-novos"></span></button>
      <button class="aba-p" data-aba="assinaturas"><span data-ic="ciclo"></span> Assinaturas <span class="cont" id="cont-assin"></span></button>
    </div>
  </nav>
  <main id="quadro" class="quadro"></main>
  <section id="assinaturas" class="assin-lista oculto"></section>
  <script type="module" src="js/acougue.js"></script>
</body>
</html>
